            const productList = document.getElementById('productList');
            productList.innerHTML = '';
            if (!list || list.length === 0) {
                productList.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10 text-sm">Tidak ada produk ditemukan.</p>`;
                return;
            }
            list.forEach(p => {
                let imgUrl = p.image || "https://images.unsplash.com/photo-1586075010923-2dd4570fb338?w=400&auto=format&fit=crop&q=80";
                let safeName = p.name.replace(/'/g, "\\'");
                productList.innerHTML += `
                    <div class="bg-white rounded-lg shadow-sm border hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                        <div>
                            <div onclick="bukaZoomGambar('${imgUrl}', '${safeName}')" class="w-full h-48 bg-white flex items-center justify-center p-2 overflow-hidden border-b cursor-pointer group" title="Klik untuk memperbesar gambar">
                                <img src="${imgUrl}" alt="${p.name}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-200">
                            </div>
                            <div class="p-3">
                                <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-semibold">${p.category || 'Umum'}</span>
                                <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 mt-1 mb-1">${p.name}</h3>
                                <div class="text-blue-600 font-bold text-sm">Rp ${(p.price || 0).toLocaleString('id-ID')}</div>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="tambahKeKeranjang(${p.id})" class="w-full bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white py-1.5 rounded text-xs font-bold transition border border-blue-200 active:scale-95">
                                + Pilih Barang
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterKategori(kategori) {
            currentCategory = kategori;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText.includes(kategori)) {
                    btn.className = "cat-btn bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "cat-btn bg-white text-gray-700 hover:bg-gray-100 px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border";
                }
            });
            if (kategori === "Semua") {
                renderProducts(products);
            } else {
                let hasil = products.filter(p => p.category === kategori);
                renderProducts(hasil);
            }
        }

        function filterProduk() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let hasil = products.filter(p => p.name.toLowerCase().includes(keyword) && (currentCategory === "Semua" || p.category === currentCategory));
            renderProducts(hasil);
        }

        function tambahKeKeranjang(id) {
            const produkPilihan = products.find(p => p.id === id);
            if (!produkPilihan) return;
            const itemAda = cart.find(item => item.id === id);
            if (itemAda) { itemAda.qty += 1; } else { cart.push({ ...produkPilihan, qty: 1 }); }
            localStorage.setItem('alhusna_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartCountMobile = document.getElementById('cartCountMobile');
            const navCartTotalBadge = document.getElementById('navCartTotalBadge');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            cartCount.innerText = totalQty;
            cartCountMobile.innerText = totalQty;
            navCartTotalBadge.innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-gray-400 text-center py-8 text-sm">Belum ada barang dipilih.</p>`;
            } else {
                cartItems.innerHTML = '';
                cart.forEach((item, index) => {
                    cartItems.innerHTML += `
                        <div class="flex flex-col bg-gray-50 p-3 rounded-lg border text-xs gap-2">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                                <button onclick="hapusItemKeranjang(${index})" class="text-red-500 font-bold px-1.5 py-0.5 bg-red-50 rounded">✕ Hapus</button>
                            </div>
                            <div class="flex justify-between items-center pt-1 border-t">
                                <div class="text-gray-600">Rp ${item.price.toLocaleString('id-ID')}</div>
                                <div class="flex items-center gap-2 bg-white border px-2 py-1 rounded">
                                    <button onclick="kurangQty(${index})" class="px-2 font-bold">-</button>
                                    <span class="font-bold text-blue-600">${item.qty}</span>
                                    <button onclick="tambahQty(${index})" class="bg-blue-600 text-white px-2 font-bold">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            cartTotal.innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        function tambahQty(index) { cart[index].qty += 1; localStorage.setItem('alhusna_cart', JSON.stringify(cart)); updateCartUI(); }
        function kurangQty(index) { cart[index].qty -= 1; if (cart[index].qty <= 0) cart.splice(index, 1); localStorage.setItem('alhusna_cart', JSON.stringify(cart)); updateCartUI(); }
        function hapusItemKeranjang(index) { cart.splice(index, 1); localStorage.setItem('alhusna_cart', JSON.stringify(cart)); updateCartUI(); }
        function bukaKeranjang() { document.getElementById('cartModal').classList.remove('hidden'); }
        function tutupKeranjang() { document.getElementById('cartModal').classList.add('hidden'); }

        function formatNomorWa(num) {
            let bersih = num.replace(/\D/g, '');
            if (bersih.startsWith('0')) bersih = '62' + bersih.substring(1);
            return bersih;
        }

        function kirimKeWhatsApp() {
            if (cart.length === 0) { alert("Pilih barang dulu!"); return; }
            let buyerName = document.getElementById('buyerName').value.trim();
            if (!buyerName) { alert("Tulis nama pemesan!"); document.getElementById('buyerName').focus(); return; }
            
            let teksPesan = "Halo Toko ALHUSNA,\nSaya *" + buyerName + "* mau pesan:\n\n";
            let total = 0;
            cart.forEach((item, idx) => {
                let subTotal = item.price * item.qty;
                total += subTotal;
                teksPesan += (idx + 1) + ". " + item.name + " (" + item.qty + "x) - Rp " + subTotal.toLocaleString('id-ID') + "\n";
            });
            
            teksPesan += "\n*Total: Rp " + total.toLocaleString('id-ID') + "*";
            teksPesan += "\n\nMohon disiapkan ya bang, terima kasih!";

            let urlWa = "https://api.whatsapp.com/send?phone=" + formatNomorWa(ownerWhatsApp) + "&text=" + encodeURIComponent(teksPesan);
            window.open(urlWa, '_blank');
        }
    </script>
</body>
</html>
